[project]
name = "askq-backend"
version = "0.1.0"
description = "ASKQ - Ask Questions to your Data: secure NL-to-SQL backend with CAIR"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# assert is the normal way to write pytest tests; tests pass generated or
# placeholder credentials on purpose (tests/test_database_sql.py still scans them),
# and build SQL strings on purpose as inputs to the validator and fixtures.
# F811: importing pytest fixtures from another test module and using them as
# test arguments looks like a redefinition to the linter.
"tests/**" = ["S101", "S105", "S106", "S608", "F811"]
# Fixed row-scope SQL templates: no user or model input is ever interpolated;
# scope ids are server-side integers rendered with int() (see the module docstring).
"app/query/policy.py" = ["S608"]
